<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Role</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0A192F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            color: #0A192F;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.2);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
        }
        .btn {
            background: #0A192F;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background: #112D4E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Select Role</h2>
        <form action="{% url 'select_student' %}" method="get">
            <button class="btn" type="submit">Student</button>
        </form>
        <form action="{% url 'select_teacher' %}" method="get">
            <button class="btn" type="submit">Teacher</button>
        </form>
    </div>
</body>
</html>
